  a{color:#C6F24E;text-decoration:none;}
  a:hover{color:#DFFA8C;}
  input{font-family:'Archivo',sans-serif;}

<div style="width:1440px;height:900px;box-sizing:border-box;background:#0B1F1A;display:flex;align-items:center;justify-content:center;color:#EAF3E7;">
  <div style="width:420px;display:flex;flex-direction:column;gap:28px;">
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="background:#EAF3E7;border-radius:7px;padding:5px 10px;display:inline-flex;align-items:center;"><img src="logo.png" alt="Active Circle" style="height:31px;width:auto;display:block;"></span>
      </div>
      <div style="font-size:14px;color:#7C8F86;">Staff &amp; Admin — Mock sign in</div>
    </div>
    <div style="background:#12261F;border:1px solid #1E3B34;border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:20px;">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label for="email" style="font-size:13px;color:#7C8F86;">Email</label>
        <input id="email" type="email" value="front.desk@activecircle.co.ke" style="background:#173028;border:1px solid #1E3B34;border-radius:10px;color:#EAF3E7;padding:12px 14px;font-size:14px;outline:none;">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label for="password" style="font-size:13px;color:#7C8F86;">Password</label>
        <input id="password" type="password" value="••••••••" style="background:#173028;border:1px solid #1E3B34;border-radius:10px;color:#EAF3E7;padding:12px 14px;font-size:14px;outline:none;">
      </div>
      <a href="SettingsHub.dc.html" style="display:block;text-align:center;background:#C6F24E;color:#0B1F1A;font-weight:600;font-size:15px;padding:13px;border-radius:10px;">Sign in</a>
      <div style="font-size:12px;color:#7C8F86;text-align:center;">This mockup skips real authentication — any click signs you in as Front Desk.</div>
    </div>
    <div style="font-size:12px;color:#7C8F86;text-align:center;">Phase 1 — Foundation mockup · not connected to a real backend</div>
  </div>
</div>
</x-dc>
