text);">Last Tuesday, 6:00pm</div><div style="flex:1.5;font-size:13px;color:var(--text);"><div style="font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;background:var(--hover);color:#C6F24E;text-align:center;display:inline-block;">Attended</div></div></div></a></div>
